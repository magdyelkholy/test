name: Node.js Scan Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # عدل حسب نسختك

      - name: Install dependencies
        run: npm install
        working-directory: ./src   # هنا مجلد src

      - name: Run scan
        run: npm run scan
        working-directory: ./src   # نفس المجلد
