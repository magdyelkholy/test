name: Run Tests

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      -"src/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./   # <-- هنا جذر المشروع

      - name: Run tests
        run: npm test
        working-directory: ./   # <-- نفس المسار
