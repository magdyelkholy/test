name: Run Tests

on:
  push:
    branches:
      - main
      - "release/**"
    path:
      - "src/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js environment
         uses: actions/setup-node@v6.0.0